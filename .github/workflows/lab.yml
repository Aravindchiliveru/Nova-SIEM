name: Nova development acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-security.txt -r requirements-interop.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_recovery_v06.py
  distributed-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/cluster.py start
      - run: python tools/cluster.py verify
      - run: python tools/cluster.py fault-test
      - if: always()
        run: python tools/cluster.py status
      - if: always()
        run: python tools/cluster.py stop
